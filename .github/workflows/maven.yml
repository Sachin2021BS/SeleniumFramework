name: Test Automation WorkFkow

on:
  schedule:
    - cron: 00 18 * * *
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Running Test Automation Framework with Maven
      run: mvn test -X -Dbrowser=chrome -DisLambdaTest=false -DisHeadless=false
      
    - name: Upload Test logs
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
       name: Test logs
       path: logs/
       
    - name: Upload screenshot as Artifacts
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
       name: screenshoot
       path: screenshoots/
       
    - name: Test Reports
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
       name: Test Reports
       path: report.html

    - name: Test Execution Status
      run: echo "Test execution Completed"

    - name: Copy Report to gh-pages Folder
      if: always()

      run: |
        mkdir -p public/extent-reports
        cp -R report.html public/extent-reports/
        cp -R report.html public/extent-reports/screenshots/
        ls -l

    - name: Deploy
      if: always()
      uses: JamesIves/github-pages-deploy-actions@v4
      with:
        folder: public/extent-reports/
        token: ${{ secrets.PAT1234 }}
        clean: true
